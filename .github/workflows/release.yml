name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Validate release tag
        run: npm run release:validate-tag -w @chatenhancer/repo-tools

  check:
    name: Check release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check extension
        run: npm run check -w @chatenhancer/extension
      - name: Check shared code and repository tools
        run: |
          npm run checks -w @chatenhancer/repo-tools -- \
            --concurrency=3 \
            @chatenhancer/eslint-config \
            @chatenhancer/playground-core \
            @chatenhancer/repo-tools
      - name: Lint root configuration
        run: npm run lint:config

  test:
    name: Test release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test extension and scripts with coverage
        run: npm run test:coverage
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-report
          path: test-results/unit/vitest-report.json
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Build and package release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extensions
        run: npm run build
      - name: Create release archives
        run: npm run release:zip -w @chatenhancer/repo-tools
      - name: Upload release archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: youtube-chat-qol-packages
          path: dist/release/*.zip

  e2e:
    name: Test release end to end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npm run test:e2e:install -w @chatenhancer/extension
      - name: Build Chrome extension
        run: npm run build:chrome
      - name: Run E2E gate
        run: npm run test:e2e:ci -w @chatenhancer/extension
      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-test-report
          path: test-results/e2e/playwright-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Collect deterministic E2E failure artifacts
        if: failure()
        run: npm run ci:e2e-artifacts -w @chatenhancer/repo-tools
      - name: Upload deterministic E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deterministic-e2e-failure-artifacts
          path: test-results/e2e/deterministic-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify release
    needs:
      - validate-tag
      - check
      - test
      - build
      - e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
      - name: Download unit test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: unit-test-report
          path: test-results/unit
      - name: Download E2E test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: e2e-test-report
          path: test-results/e2e
      - name: Write test summary
        if: always()
        run: npm run ci:test-summary -w @chatenhancer/repo-tools
      - name: Require successful jobs
        if: |
          always() && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          )
        run: exit 1

  github-release:
    name: Create GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Download release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: youtube-chat-qol-packages
          path: dist/release
      - name: Write release notes
        run: |
          previous_tag="$(git tag --list 'v[0-9]*' --sort=version:refname | awk -v current="${GITHUB_REF_NAME}" '
            $0 == current { print previous; found = 1; exit }
            { previous = $0 }
            END { if (!found) exit 1 }
          ')"

          if [ -z "${previous_tag}" ]; then
            echo "Could not find a previous release tag for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          changelog_range="${previous_tag}...${GITHUB_REF_NAME}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${changelog_range}"
          printf 'Full changelog: [%s](%s)\n' "${changelog_range}" "${changelog_url}" > release-notes.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: release-notes.md
          files: dist/release/*.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Keep cancellation, upload, and submission together across release tags.
    concurrency:
      group: chrome-web-store-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
      - name: Download release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: youtube-chat-qol-packages
          path: dist/release
      - name: Submit to Chrome Web Store
        run: npm run publish:chrome
        env:
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON }}
          CHROME_WEBSTORE_REPLACE_PENDING: 'true'

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
      - name: Download release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: youtube-chat-qol-packages
          path: dist/release
      - name: Submit to Firefox Add-ons
        run: npm run publish:firefox
        env:
          FIREFOX_AMO_ADDON_ID: ${{ secrets.FIREFOX_AMO_ADDON_ID }}
          FIREFOX_AMO_API_KEY: ${{ secrets.FIREFOX_AMO_API_KEY }}
          FIREFOX_AMO_API_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}

  publish-safari:
    name: Publish to Mac App Store
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    # A newer tag must not change the pending version during another upload/submission.
    concurrency:
      group: mac-app-store-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure App Store Connect API key
        env:
          YTCQ_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.YTCQ_APP_STORE_CONNECT_PRIVATE_KEY }}
          # Identifier-like Safari publish settings are secrets so public logs redact them.
          YTCQ_APP_STORE_CONNECT_KEY_ID: ${{ secrets.YTCQ_APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "${YTCQ_APP_STORE_CONNECT_PRIVATE_KEY}" ]; then
            echo "Missing YTCQ_APP_STORE_CONNECT_PRIVATE_KEY." >&2
            exit 1
          fi

          if [ -z "${YTCQ_APP_STORE_CONNECT_KEY_ID}" ]; then
            echo "Missing YTCQ_APP_STORE_CONNECT_KEY_ID." >&2
            exit 1
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${YTCQ_APP_STORE_CONNECT_KEY_ID}.p8"
          umask 077
          printf '%s\n' "${YTCQ_APP_STORE_CONNECT_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "YTCQ_APP_STORE_CONNECT_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
      - name: Configure Safari signing assets
        run: npm run safari:configure-signing -w @chatenhancer/repo-tools
        env:
          YTCQ_SAFARI_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.YTCQ_SAFARI_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          YTCQ_SAFARI_DISTRIBUTION_CERTIFICATES_P12_BASE64: ${{ secrets.YTCQ_SAFARI_DISTRIBUTION_CERTIFICATES_P12_BASE64 }}
          YTCQ_SAFARI_APP_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.YTCQ_SAFARI_APP_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          YTCQ_SAFARI_INSTALLER_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.YTCQ_SAFARI_INSTALLER_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          YTCQ_SAFARI_CERTIFICATE_PASSWORD: ${{ secrets.YTCQ_SAFARI_CERTIFICATE_PASSWORD }}
          YTCQ_SAFARI_APP_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.YTCQ_SAFARI_APP_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          YTCQ_SAFARI_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.YTCQ_SAFARI_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          YTCQ_SAFARI_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.YTCQ_SAFARI_SIGNING_KEYCHAIN_PASSWORD }}
          YTCQ_SAFARI_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.YTCQ_SAFARI_APP_PROVISIONING_PROFILE_BASE64 }}
          YTCQ_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.YTCQ_SAFARI_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          YTCQ_SAFARI_APP_PROVISIONING_PROFILE_BUNDLE_ID: ${{ secrets.YTCQ_SAFARI_APP_PROVISIONING_PROFILE_BUNDLE_ID }}
          YTCQ_SAFARI_EXTENSION_PROVISIONING_PROFILE_BUNDLE_ID: ${{ secrets.YTCQ_SAFARI_EXTENSION_PROVISIONING_PROFILE_BUNDLE_ID }}
          YTCQ_SAFARI_EXPORT_SIGNING_CERTIFICATE: ${{ secrets.YTCQ_SAFARI_EXPORT_SIGNING_CERTIFICATE }}
          YTCQ_SAFARI_EXPORT_INSTALLER_SIGNING_CERTIFICATE: ${{ secrets.YTCQ_SAFARI_EXPORT_INSTALLER_SIGNING_CERTIFICATE }}
      - name: Submit to Mac App Store
        run: npm run publish:safari
        env:
          YTCQ_SAFARI_BUNDLE_ID: ${{ secrets.YTCQ_SAFARI_BUNDLE_ID }}
          YTCQ_SAFARI_DEVELOPMENT_TEAM: ${{ secrets.YTCQ_SAFARI_DEVELOPMENT_TEAM }}
          YTCQ_APP_STORE_CONNECT_KEY_ID: ${{ secrets.YTCQ_APP_STORE_CONNECT_KEY_ID }}
          YTCQ_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.YTCQ_APP_STORE_CONNECT_ISSUER_ID }}
          YTCQ_APP_STORE_APPLE_ID: ${{ secrets.YTCQ_APP_STORE_APPLE_ID }}
          YTCQ_APP_STORE_BUILD_WAIT_ATTEMPTS: 20
          YTCQ_APP_STORE_REPLACE_PENDING: 'true'
