name: retry-youtube-ci

on:
  workflow_run:
    workflows: [extension]
    types: [completed]

jobs:
  retry:
    name: Retry Google-blocked YouTube tests
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # This workflow has write access: execute only trusted default-branch code.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Download YouTube E2E test report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: youtube-e2e-test-report
          path: ${{ runner.temp }}/youtube-ci-report
      - name: Retry only a Google challenge failure, once
        if: steps.report.outcome == 'success'
        run: node packages/repo-tools/scripts/retry-youtube-ci.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YTCQ_RETRY_RUN_ID: ${{ github.event.workflow_run.id }}
          YTCQ_RETRY_REPORT: ${{ runner.temp }}/youtube-ci-report/playwright-report.json
