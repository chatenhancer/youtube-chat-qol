name: extension

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Cache npm downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check extension
        run: npm run check -w @chatenhancer/extension
      - name: Check shared code and repository tools
        run: |
          npm run checks -w @chatenhancer/repo-tools -- \
            --concurrency=3 \
            @chatenhancer/eslint-config \
            @chatenhancer/playground-core \
            @chatenhancer/repo-tools
      - name: Lint root configuration
        run: npm run lint:config

  test:
    name: Test extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Cache npm downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test extension and scripts with coverage
        run: npm run test:coverage
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-report
          path: test-results/unit/vitest-report.json
          if-no-files-found: ignore
          retention-days: 1

  build-and-e2e-deterministic:
    name: Build extensions and run deterministic tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Cache npm downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npm run test:e2e:install -w @chatenhancer/extension
      - name: Build extensions
        run: npm run build
      - name: Run deterministic E2E gate
        run: npm run test:e2e:ci:deterministic -w @chatenhancer/extension
      - name: Upload deterministic E2E test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deterministic-e2e-test-report
          path: test-results/e2e/playwright-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Collect deterministic E2E failure artifacts
        if: failure()
        run: npm run ci:e2e-artifacts -w @chatenhancer/repo-tools
      - name: Upload deterministic E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deterministic-e2e-failure-artifacts
          path: test-results/e2e/deterministic-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-youtube:
    name: Test YouTube integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Cache npm downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npm run test:e2e:install -w @chatenhancer/extension
      - name: Build Chrome extension
        run: npm run build:chrome
      - name: Run logged-out YouTube scenarios
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run test:e2e:ci:youtube -w @chatenhancer/extension
      - name: Run manually requested integration tiers
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:scheduled -w @chatenhancer/extension
      - name: Run scheduled integration tiers
        if: github.event_name == 'schedule'
        run: npm run test:e2e:scheduled -w @chatenhancer/extension
      - name: Upload YouTube E2E test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: youtube-e2e-test-report
          path: test-results/e2e/playwright-report.json
          if-no-files-found: ignore
          retention-days: 1

  verify:
    name: Verify extension
    needs:
      - check
      - test
      - build-and-e2e-deterministic
      - e2e-youtube
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Download unit test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: unit-test-report
          path: test-results/unit
      - name: Download deterministic E2E test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: deterministic-e2e-test-report
          path: test-results/e2e/deterministic
      - name: Download YouTube E2E test report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: youtube-e2e-test-report
          path: test-results/e2e/youtube
      - name: Write test summary
        if: always()
        run: npm run ci:test-summary -w @chatenhancer/repo-tools
        env:
          YTCQ_PLAYWRIGHT_JSON_REPORTS: test-results/e2e/deterministic/playwright-report.json,test-results/e2e/youtube/playwright-report.json
      - name: Require successful jobs
        if: |
          always() && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          )
        run: exit 1
