name: cloudflare

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare source
        run: |
          npm run checks -w @chatenhancer/repo-tools -- \
            --concurrency=2 \
            @chatenhancer/language-redirect \
            @chatenhancer/playground \
            @chatenhancer/playground-core \
            @chatenhancer/product-config \
            @chatenhancer/repo-tools
      - name: Check Cloudflare Workers
        run: npm run cloudflare:check

  test:
    name: Test Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Test Cloudflare Workers
        run: npm run cloudflare:test

  verify:
    name: Verify Cloudflare
    needs:
      - check
      - test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful jobs
        if: |
          always() && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          )
        run: exit 1

  deploy-language-redirect:
    name: Deploy language redirect
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-language-redirect-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Install dependencies
        run: npm ci
      - name: Deploy language redirect Worker
        run: |
          npm run deploy -w @chatenhancer/language-redirect -- \
            --tag "${GITHUB_SHA}" \
            --message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-playground:
    name: Deploy Playground
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-playground-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install pinned npm
        run: npm install --global "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
      - name: Install dependencies
        run: npm ci
      - name: Deploy Playground Worker
        run: |
          npm run deploy -w @chatenhancer/playground -- \
            --tag "${GITHUB_SHA}" \
            --message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
